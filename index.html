<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="logo">Logo</a>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
      </div>
      <button id="createUserBtn" class="btn btn-primary">+ Create User</button>
    </nav>

    <main>
      <header class="page-header">
        <h1>Users</h1>
        <p id="userCount"></p>
      </header>

      <div class="user-container" id="userContainer"></div>
    </main>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <form class="modal-card" id="userForm">
        <button type="button" class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
        <h2 id="modalTitle">Create Profile</h2>

        <input type="text" id="nameInput" placeholder="Name" required />
        <input type="email" id="emailInput" placeholder="Email" required />
        <input type="url" id="imageInput" placeholder="Image URL (optional)" />

        <button type="submit" id="submitBtn" class="btn btn-primary">Create</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
